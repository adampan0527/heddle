[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heddle-common"
version = "0.0.1"
description = "Shared Python library for heddle CLI and daemon (logging, schema, constants)"
requires-python = ">=3.11"
authors = [{name = "heddle contributors"}]
license = {text = "Apache-2.0"}
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["heddle_common*"]
exclude = ["tests*"]