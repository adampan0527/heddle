[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heddle-daemon"
version = "0.0.1"
description = "heddle-daemon — Python asyncio + LangGraph workflow engine (standalone installable; root pyproject.toml also installs this)"
requires-python = ">=3.11"
authors = [{name = "heddle contributors"}]
license = {text = "Apache-2.0"}
dependencies = [
    "heddle-common",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=0.3",
    "websockets>=12.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# feat-023: per-provider LangChain SDKs. A deployment that uses only
# one provider should install just that one (e.g. `pip install
# heddle-daemon[anthropic]`). ``all`` covers the default templates
# so `heddle test` / `heddle start` work out-of-the-box.
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
bedrock = ["langchain-aws>=0.3"]
ollama = ["langchain-ollama>=0.3"]
all = [
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-aws>=0.3",
    "langchain-ollama>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["heddle_daemon*"]
exclude = ["tests*"]