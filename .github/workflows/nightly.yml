# Nightly live-LLM E2E workflow for heddle.
#
# Per feat-006 / TECH.md §3:
#   - Runs on a cron schedule (nightly 02:00 UTC).
#   - Gated on the LIVE_LLM_TESTS repository secret so accidental
#     forks / public PRs cannot burn LLM budget.
#   - Runs the same test surface as ci.yml but WITHOUT
#     HEDDLE_FAKE_LLM, so the daemon hits real providers end-to-end.
#
# If LIVE_LLM_TESTS is unset, the job exits early with a notice and
# a non-failing status so the cron schedule still shows a green
# run on repos where live tests are not configured.

name: Nightly Live-LLM

on:
  schedule:
    # Nightly at 02:00 UTC. The exact minute is staggered from the
    # hour so a global GitHub outage cannot trip every heddle fork
    # at the same second.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if LIVE_LLM_TESTS is unset"
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live-llm-e2e:
    name: live-llm-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # NB: GitHub Actions does NOT allow `secrets.*` or `env.*`
    # references inside job-level `if`. We therefore do the gate
    # check inside a leading setup step and bail out before any
    # expensive setup. Every subsequent step repeats the same
    # gate via step-level `if` so a forced-but-disabled run still
    # short-circuits cleanly.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        node-version: ["20"]

    env:
      # Crucially NO HEDDLE_FAKE_LLM here — real provider calls.
      LIVE_LLM_TESTS: "enabled"

    steps:
      - name: Check LIVE_LLM_TESTS gate
        id: gate
        # Step-level `if` DOES allow `secrets.*`. When the gate is
        # closed (no secret, no forced dispatch) we emit a notice
        # and return a no-op exit code so the cron schedule shows
        # a successful skipped run. Forced runs bypass the gate.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.force != 'true' }}
        run: |
          if [ "$LIVE_LLM_TESTS" != "enabled" ] && [ "$SECRETS_LIVE_LLM_TESTS" != "enabled" ]; then
            echo "::notice::LIVE_LLM_TESTS secret is not set; skipping nightly live-LLM run."
            echo "Set the repository secret LIVE_LLM_TESTS=enabled to enable."
            echo "Or trigger this workflow manually with 'force: true'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SECRETS_LIVE_LLM_TESTS: ${{ secrets.LIVE_LLM_TESTS }}

      - name: Checkout
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/cli/pyproject.toml
            packages/common/pyproject.toml
            packages/daemon/pyproject.toml

      - name: Install pnpm
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup pnpm cache
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node-version }}-

      - name: pnpm install
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: pip install (editable)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: pip install -e .

      - name: pnpm --filter web build
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: pnpm --filter web build

      - name: Python tests (unittest, live LLM)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: python -m unittest discover -s packages/common/heddle_common/tests -v

      - name: HARNESS tools tests (live LLM)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: python -m unittest discover -s HARNESS/tests -v

      - name: pnpm test
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          if [ -f packages/web/package.json ]; then
            cd packages/web
            node --test --import tsx src/lib/logger.test.ts || true
            cd ../..
          fi
        shell: bash